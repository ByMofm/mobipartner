name: Daily Scrape Pipeline

on:
  schedule:
    - cron: "0 23 * * *"  # 23:00 UTC = 20:00 Argentina
  workflow_dispatch:
    inputs: {}

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  USD_ARS_RATE_FALLBACK: ${{ secrets.USD_ARS_RATE_FALLBACK }}

jobs:
  scrape-zonaprop:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          playwright install firefox --with-deps

      - name: Run ZonaProp spider
        working-directory: backend/scrapers
        env:
          PYTHONPATH: /home/runner/work/mobiPartner/mobiPartner/backend
        run: python -m scrapy crawl zonaprop

  scrape-argenprop:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          playwright install firefox --with-deps

      - name: Run Argenprop spider
        working-directory: backend/scrapers
        env:
          PYTHONPATH: /home/runner/work/mobiPartner/mobiPartner/backend
        run: python -m scrapy crawl argenprop

  scrape-mercadolibre:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          playwright install firefox --with-deps

      - name: Run MercadoLibre spider
        working-directory: backend/scrapers
        env:
          PYTHONPATH: /home/runner/work/mobiPartner/mobiPartner/backend
        run: python -m scrapy crawl mercadolibre

  scrape-inmoclick:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (no Playwright)
        run: pip install -r backend/requirements.txt

      - name: Run InmoClick spider
        working-directory: backend/scrapers
        env:
          PYTHONPATH: /home/runner/work/mobiPartner/mobiPartner/backend
        run: python -m scrapy crawl inmoclick

  scrape-guzman-guzman:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          playwright install firefox --with-deps

      - name: Run Guzmán & Guzmán spider
        working-directory: backend/scrapers
        env:
          PYTHONPATH: /home/runner/work/mobiPartner/mobiPartner/backend
        run: python -m scrapy crawl guzman_guzman

  scrape-tucumanpropiedades:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          playwright install firefox --with-deps

      - name: Run Tucumán Propiedades spider
        working-directory: backend/scrapers
        env:
          PYTHONPATH: /home/runner/work/mobiPartner/mobiPartner/backend
        run: python -m scrapy crawl tucumanpropiedades

  scrape-garcia-pinto:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (no Playwright)
        run: pip install -r backend/requirements.txt

      - name: Run García Pinto spider
        working-directory: backend/scrapers
        env:
          PYTHONPATH: /home/runner/work/mobiPartner/mobiPartner/backend
        run: python -m scrapy crawl garcia_pinto

  scrape-lima-inmobiliaria:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (no Playwright)
        run: pip install -r backend/requirements.txt

      - name: Run Lima Inmobiliaria spider
        working-directory: backend/scrapers
        env:
          PYTHONPATH: /home/runner/work/mobiPartner/mobiPartner/backend
        run: python -m scrapy crawl lima_inmobiliaria

  post-process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [scrape-zonaprop, scrape-argenprop, scrape-mercadolibre, scrape-inmoclick, scrape-guzman-guzman, scrape-tucumanpropiedades, scrape-garcia-pinto, scrape-lima-inmobiliaria]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (no Playwright)
        run: pip install -r backend/requirements.txt

      - name: Run post-processing
        working-directory: backend
        env:
          PYTHONPATH: /home/runner/work/mobiPartner/mobiPartner/backend
        run: python scripts/run_postprocess.py

  notify:
    runs-on: ubuntu-latest
    needs: [scrape-zonaprop, scrape-argenprop, scrape-mercadolibre, scrape-inmoclick, scrape-guzman-guzman, scrape-tucumanpropiedades, scrape-garcia-pinto, scrape-lima-inmobiliaria, post-process]
    if: always()
    steps:
      - name: Pipeline summary
        run: |
          echo "## Scrape Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ZonaProp | ${{ needs.scrape-zonaprop.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Argenprop | ${{ needs.scrape-argenprop.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MercadoLibre | ${{ needs.scrape-mercadolibre.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| InmoClick | ${{ needs.scrape-inmoclick.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Guzmán & Guzmán | ${{ needs.scrape-guzman-guzman.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tucumán Propiedades | ${{ needs.scrape-tucumanpropiedades.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| García Pinto | ${{ needs.scrape-garcia-pinto.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lima Inmobiliaria | ${{ needs.scrape-lima-inmobiliaria.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Post-process | ${{ needs.post-process.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
